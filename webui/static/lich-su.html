<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch sử — Video Dịch Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Phudu:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(700px 380px at 50% -8%,#f7931a1a,transparent 70%)}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:0 20px 80px}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:11px}

.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:18px 0;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);
  font-weight:700;letter-spacing:-.02em;font-size:15px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--fire);
  display:grid;place-items:center;font-size:13px;box-shadow:var(--glow-sm)}
.back{background:var(--surface);border:1px solid var(--border);color:var(--muted);
  border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;
  text-decoration:none;transition:.15s;font-family:var(--body)}
.back:hover{border-color:var(--primary);color:var(--primary)}

.head{padding:44px 0 26px}
.eyebrow{color:var(--primary);margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.012em;
  font-size:clamp(30px,5.5vw,46px);line-height:1.06;margin-bottom:10px}
.lede{color:var(--muted);font-size:15px;max-width:52ch}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:11px 15px;min-width:104px}
.stat b{display:block;font-family:var(--display);font-size:21px;font-weight:700;
  color:var(--primary);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase}

/* ---------- danh sach du an ---------- */
.proj{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;transition:.16s}
.proj:hover{border-color:#3b4a63}
.proj.open{border-color:var(--primary);box-shadow:var(--glow-card)}
.proj-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.thumb{width:52px;height:52px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--border);display:grid;place-items:center;font-size:20px;flex:none}
.proj.open .thumb{background:var(--fire);border-color:transparent}
.proj-meta{flex:1;min-width:0}
.proj-title{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:4px}
.proj-sub{color:var(--muted);font-family:var(--mono);font-size:10px;
  letter-spacing:.07em;display:flex;gap:8px;flex-wrap:wrap}
.proj-sub i{font-style:normal;color:#475569}
.chev{color:var(--muted);flex:none;transition:.2s;font-size:13px}
.proj.open .chev{transform:rotate(90deg);color:var(--primary)}

.proj-body{display:none;padding:0 18px 18px;border-top:1px solid var(--border)}
.proj.open .proj-body{display:block}
.proj-body video{width:100%;max-height:56vh;background:#000;border-radius:11px;
  margin:16px 0 14px;display:block}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px}
@media(max-width:560px){.files{grid-template-columns:1fr}}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0a0c10;
  border:1px solid var(--border);border-radius:10px;text-decoration:none;
  color:var(--fg);font-size:12.5px;transition:.15s}
.file:hover{border-color:var(--primary);color:var(--primary)}
.file span:first-child{font-size:15px;flex:none}
.file b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path{margin-top:13px;font-family:var(--mono);font-size:10.5px;color:#475569;
  word-break:break-all;text-transform:none;letter-spacing:0}

.empty{text-align:center;padding:70px 24px;background:var(--surface);
  border:1px dashed #2b3a52;border-radius:var(--radius)}
.empty div:first-child{font-size:38px;margin-bottom:14px;opacity:.6}
.empty h3{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:8px}
.empty p{color:var(--muted);font-size:13.5px;max-width:38ch;margin:0 auto 20px}
.empty a{display:inline-block;background:var(--fire);color:#030304;text-decoration:none;
  font-family:var(--display);font-weight:700;padding:11px 20px;border-radius:11px;
  font-size:14px;box-shadow:var(--glow-md)}
.foot{text-align:center;margin-top:46px;color:#475569;font-size:10px}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <div class="brand"><span class="logo">⚡</span> VIDEO DỊCH VIỆT</div>
  <a class="back" href="/">← Về trang dịch</a>
</div>

<div class="head">
  <div class="eyebrow mono">✦ NHỮNG VIDEO ĐÃ XỬ LÝ XONG</div>
  <h1>Lịch sử làm việc</h1>
  <p class="lede">Mỗi video đã dịch xong được lưu thành một thư mục riêng.
    Mở lại lúc nào cũng được, kể cả sau khi tắt máy.</p>
  <div class="stats" id="stats"></div>
</div>

<div id="list"></div>

<div class="foot mono">$ ĐỌC TỪ THƯ MỤC OUTPUT · KHÔNG DÙNG CƠ SỞ DỮ LIỆU</div>
</div>
<script src="lich-su.js"></script>
</body>
</html>
