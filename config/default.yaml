audio:
  bg_volume: 0.3
  dropout_transition: 2
  separation_model: htdemucs
  two_stems: true
caption:
  blur_strength: 51
  detect_samples: 10
  min_y_ratio: 0.6
  padding: 20
  style:
    alignment: 2
    auto_position: false
    color: '&H00F3FF'
    bold: false
    font: Phudu ExtraBold
    margin_v: 35
    outline: 2
    outline_color: '&H000000'
    shadow: 1
    size: 14
download:
  cookies_file: cookies.txt
  max_duration_sec: 300
  no_watermark: true
  output_dir: workspace/downloads
  retry_count: 3
  timeout: 60
output:
  audio_bitrate: 192k
  codec: libx264
  crf: 24   # 20 lam video phinh ~4.7 lan; 24 nhe hon nhieu, mat thuong kho phan biet
  preset: fast
  resolution: 1080x1920
revid:
  api_key: ''
  enabled: false
  remove_bg_model: u2net
  use_for:
  - detect_caption
  - blur_region
  - add_subtitle
scheduler:
  cron: 0 8 * * *
  enabled: false
  url_file: workspace/urls.txt
stt:
  compute_type: float16
  device: cuda
  language: zh
  model: large-v3
  vad_filter: true
  vad_min_silence_ms: 500
translation:
  api_key: ''
  # 1 request/batch. Free tier Gemini chi 20 request/ngay nen batch to
  # giup 1 video ~6 phut chi ton 4-5 request thay vi 18.
  batch_size: 60
  model: gemini-2.5-flash-lite
  provider: gemini
  target_languages:
  - vi
  - en
  temperature: 0.3
tts:
  kokoro_model: models/kokoro-v1.0.onnx
  kokoro_speed: 1.0
  kokoro_voice: af_heart
  kokoro_voices: models/voices-v1.0.bin
  max_speed: 2.5
  provider: edge-tts
  voices:
    en: en-US-JennyNeural
    ja: ja-JP-NanamiNeural
    ko: ko-KR-SunHiNeural
    th: th-TH-PremwadeeNeural
    vi: vi-VN-HoaiMyNeural
upload:
  delay_between: 30
  platforms: []
  tiktok:
    cookies: cookies_tiktok.txt
    default_tags: '#translated #viral #fyp'
  youtube:
    credentials: config/youtube_creds.json
    default_category: '22'
    default_privacy: private

# Bat/tat cac buoc nang. Voi video local khong co phu de chay san va
# khong can giu nhac nen, tat ca hai de chay nhanh va bot phu thuoc.
pipeline:
  separate_audio: false     # Demucs tach nhac nen (can torch, nang)
  blur_old_captions: false  # PaddleOCR do + blur phu de cu (can opencv)
